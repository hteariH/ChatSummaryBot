services:
  app:
    build: .
    container_name: chat-summary-bot
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/chatsummarybot
      - SUMMARY_CRON=${SUMMARY_CRON:-0 0 21 * * *}
      - ADMIN_CHAT_ID=${ADMIN_CHAT_ID}
      - LOKI_URL=${LOKI_URL}
      - LOKI_USERNAME=${LOKI_USERNAME}
      - LOKI_PASSWORD=${LOKI_PASSWORD}
    networks:
      - bot-network

  mongodb:
    image: mongo:7
    container_name: chat-summary-mongodb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - mongo-data:/data/db
    networks:
      - bot-network

volumes:
  mongo-data:

networks:
  bot-network:
    driver: bridge
