spring:
  application:
    name: ChatSummaryBot
  mongodb:
    uri: mongodb://localhost:27017/chatsummarybot

# Telegram Bot
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}

# Gemini API
gemini:
  api-key: ${GEMINI_API_KEY}
  # Models tried in order; on 429 (quota/rate limit) the request falls through to the next one.
  models: ${GEMINI_MODELS:gemini-3.5-flash,gemini-3-flash,gemini-2.5-flash}
  # Optional output tuning; -1 means "unset" (keep model defaults). Set thinking-budget (>= 0) to
  # cap internal "thinking" tokens so the model leaves room for a visible answer (prevents
  # MAX_TOKENS empty responses on large multimodal transcripts); 0 disables thinking entirely.
  max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:-1}
  thinking-budget: ${GEMINI_THINKING_BUDGET:-1}
  retry:
    max-attempts: ${GEMINI_RETRY_MAX_ATTEMPTS:5}
    delay: ${GEMINI_RETRY_DELAY:10000}
    multiplier: ${GEMINI_RETRY_MULTIPLIER:2}
    max-delay: ${GEMINI_RETRY_MAX_DELAY:60000}

# Summary scheduler (default: daily at 21:00)
summary:
  cron: ${SUMMARY_CRON:0 0 21 * * *}
  admin-chat-id: ${ADMIN_CHAT_ID}

# Photo processing (downscale before storing / sending to Gemini to bound input tokens)
image:
  max-dimension: ${IMAGE_MAX_DIMENSION:1024}

# ffmpeg is used to strip the video track from video notes, keeping only audio for Gemini
ffmpeg:
  path: ${FFMPEG_PATH:ffmpeg}

# Storage for attachments (voices)
storage:
  path: ${STORAGE_PATH:/app/storage}
  limits:
    daily-per-chat: ${STORAGE_DAILY_LIMIT:524288000} # 500MB
    global: ${STORAGE_GLOBAL_LIMIT:10737418240} # 10GB

logging:
  loki:
    url: ${LOKI_URL:}
    username: ${LOKI_USERNAME:}
    password: ${LOKI_PASSWORD:}
  level:
    root: INFO
    com.chatsummary: INFO
    org.springframework: INFO
    org.mongodb: INFO
    org.telegram: INFO
