quarkus:
  application:
    name: ChatSummaryBot
  mongodb:
    connection-string: ${MONGODB_URI:mongodb://localhost:27017/chatsummarybot}
  log:
    level: INFO
    category:
      "com.chatsummary":
        level: DEBUG
      "org.mongodb":
        level: INFO
      "org.telegram":
        level: INFO

# Telegram Bot
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}

# Gemini API
gemini:
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  retry:
    max-attempts: ${GEMINI_RETRY_MAX_ATTEMPTS:3}
    delay: ${GEMINI_RETRY_DELAY:1000}

# Summary scheduler
summary:
  cron: ${SUMMARY_CRON:0 0 21 * * *}
  admin-chat-id: ${ADMIN_CHAT_ID}

# Loki logging (used by logback.xml)
logging:
  loki:
    url: ${LOKI_URL:}
    username: ${LOKI_USERNAME:}
    password: ${LOKI_PASSWORD:}
