spring:
  application:
    name: ChatSummaryBot
  mongodb:
    uri: mongodb://localhost:27017/chatsummarybot

# Telegram Bot
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}

# Gemini API
gemini:
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL:gemini-3.5-flash}
  backup-model: ${GEMINI_BACKUP_MODEL:gemini-2.5-flash}
  retry:
    max-attempts: ${GEMINI_RETRY_MAX_ATTEMPTS:3}
    delay: ${GEMINI_RETRY_DELAY:1000}

# Summary scheduler (default: daily at 21:00)
summary:
  cron: ${SUMMARY_CRON:0 0 21 * * *}
  admin-chat-id: ${ADMIN_CHAT_ID}

# Photo processing (downscale before storing / sending to Gemini to bound input tokens)
image:
  max-dimension: ${IMAGE_MAX_DIMENSION:1024}

# ffmpeg is used to strip the video track from video notes, keeping only audio for Gemini
ffmpeg:
  path: ${FFMPEG_PATH:ffmpeg}

# Storage for attachments (voices)
storage:
  path: ${STORAGE_PATH:/app/storage}
  limits:
    daily-per-chat: ${STORAGE_DAILY_LIMIT:524288000} # 500MB
    global: ${STORAGE_GLOBAL_LIMIT:10737418240} # 10GB

logging:
  loki:
    url: ${LOKI_URL:}
    username: ${LOKI_USERNAME:}
    password: ${LOKI_PASSWORD:}
  level:
    root: INFO
    com.chatsummary: INFO
    org.springframework: INFO
    org.mongodb: INFO
    org.telegram: INFO
